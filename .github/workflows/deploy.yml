# Despliegue automático al hosting cPanel (sin SSH).
#
# Cada push a "main":
#   1. Instala dependencias de producción y compila estilos/scripts en GitHub.
#   2. Sube por FTPS con lftp (6 archivos en paralelo, con reintentos):
#        build/rye/          → /home/<usuario>/rye/          (nunca toca .env ni storage/)
#        build/public_html/  → /home/<usuario>/public_html/  (nunca toca uploads/)
#   3. Llama a https://<dominio>/_deploy para aplicar migraciones y limpiar cachés.
#
# Secretos necesarios (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     servidor FTP (ej. paul.cloudserver17.com)
#   FTP_USERNAME   cuenta FTP cuya carpeta es la de inicio (/home/<usuario>)
#   FTP_PASSWORD   contraseña de esa cuenta FTP
#   DEPLOY_TOKEN   la misma clave que DEPLOY_TOKEN en rye/.env del hosting
# Variable (no secreta):
#   SITE_URL       ej. https://radawescalzadosbrasileros.com

name: Desplegar al hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: ¿Están configurados los secretos?
        if: env.FTP_SERVER == ''
        run: |
          echo "::warning::Faltan los secretos FTP_SERVER / FTP_USERNAME / FTP_PASSWORD / DEPLOY_TOKEN. No se despliega."
          echo "Configúralos en Settings → Secrets and variables → Actions y vuelve a ejecutar."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: PHP 8.3
        if: env.FTP_SERVER != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, fileinfo, gd, zip, intl, bcmath
          tools: composer:v2
          coverage: none

      - name: Dependencias PHP (producción)
        if: env.FTP_SERVER != ''
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Node 22
        if: env.FTP_SERVER != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar estilos y scripts
        if: env.FTP_SERVER != ''
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Armar carpetas rye/ y public_html/
        if: env.FTP_SERVER != ''
        run: |
          set -e
          mkdir -p build/rye build/public_html
          tar --exclude=./.git --exclude=./.github --exclude=./node_modules --exclude=./build \
              --exclude=./tests --exclude=./public --exclude=./storage --exclude=./.env \
              --exclude=./deploy --exclude=./scripts \
              -cf - . | (cd build/rye && tar -xf -)
          # public_html: assets + index.php y .htaccess de producción (nunca uploads/)
          cp -r public/css public/js public/favicon.ico public/robots.txt build/public_html/
          cp public/google*.html build/public_html/ 2>/dev/null || true   # verificación de Google Search Console
          mkdir -p build/public_html/images
          cp -r public/images/brands build/public_html/images/
          cp deploy/index.php build/public_html/index.php
          cp deploy/htaccess build/public_html/.htaccess
          echo "rye: $(find build/rye -type f | wc -l) archivos · public_html: $(find build/public_html -type f | wc -l) archivos"

      - name: Instalar lftp
        if: env.FTP_SERVER != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          # Ajustes comunes: FTPS explícito, reintentos y tiempo de espera
          cat > "$HOME/.lftprc" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          set mirror:parallel-transfer-count 6
          set cmd:fail-exit true
          EOF
          sed -i 's/^ *//' "$HOME/.lftprc"

      - name: Subir sistema (rye/, sin vendor ni .env ni storage)
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            mirror -R --no-perms --verbose=1               --exclude-glob .env --exclude-glob .git*               --exclude-glob storage/ --exclude-glob vendor/               build/rye/ rye/;
            bye"

      - name: Librerías (vendor) en un solo zip, solo si cambiaron
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          URL="${SITE_URL:-https://radawescalzadosbrasileros.com}"
          HASH=$(sha1sum composer.lock | cut -c1-40)
          STATUS=$(curl -sS --fail-with-body -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "$URL/_deploy/estado")
          echo "Servidor: $STATUS"
          CURRENT=$(echo "$STATUS" | php -r '$j = json_decode(stream_get_contents(STDIN)); echo $j->vendor_hash ?? "";')
          if [ "$HASH" = "$CURRENT" ]; then
            echo "Las librerías no cambiaron: no se suben."
            exit 0
          fi
          echo "Librerías nuevas ($HASH): subiendo vendor.zip"
          (cd build/rye && zip -qr ../vendor.zip vendor)
          ls -lh build/vendor.zip
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            mkdir -p -f rye/storage/app/deploy;
            put -O rye/storage/app/deploy build/vendor.zip;
            bye"
          RESP=$(curl -sS --fail-with-body --max-time 300 -X POST                -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "X-Vendor-Hash: $HASH" "$URL/_deploy/vendor")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'

      - name: Subir parte pública (public_html/, nunca uploads)
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            mirror -R --no-perms --verbose=1 --exclude-glob uploads/ build/public_html/ public_html/;
            bye"

      - name: Aplicar migraciones y limpiar cachés
        if: env.FTP_SERVER != ''
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          URL="${SITE_URL:-https://radawescalzadosbrasileros.com}/_deploy"
          RESP=$(curl -sS --fail-with-body -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "$URL")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true'

      - name: Comprobar que la página responde
        if: env.FTP_SERVER != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          URL="${SITE_URL:-https://radawescalzadosbrasileros.com}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
          echo "Portada: $CODE"
          test "$CODE" = "200"
